components:
  schemas:
    email:
      type: string
      format: email
      pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
    timestamp:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    team-image:
      type: string
    '500':
      type: object
      properties:
        message:
          type: string
        code:
          type: string
      required:
      - message
      - code
    slug:
      type: string
      minLength: 3
      maxLength: 60
      pattern: ^[a-z](?:[a-z0-9-]*[a-z0-9])?$
    sso-resource:
      type: string
      enum:
      - apis
      - schemas
      - rules
      - sdks
      - workspaces
      - sync-project
      - project
      - publish
      - mcp
    token-response:
      type: object
      properties:
        refreshToken:
          type: string
        accessToken:
          type: string
      required:
      - refreshToken
      - accessToken
      additionalProperties: false
    user:
      type: object
      properties:
        uid:
          default: nanoid()
          $ref: '#/components/schemas/nanoid'
        createdAt:
          default: unixTimestamp()
          $ref: '#/components/schemas/timestamp'
        updatedAt:
          default: unixTimestamp()
          $ref: '#/components/schemas/timestamp'
        theme:
          type: string
        userIndex:
          type: string
        email:
          $ref: '#/components/schemas/email'
        teams:
          type: array
          items:
            $ref: '#/components/schemas/team-ref'
        activeTeamId:
          anyOf:
          - type: string
          - type: 'null'
        hasGithub:
          default: false
          type: boolean
        hasBitbucket:
          default: false
          type: boolean
        forgejoToken:
          type: string
      required:
      - uid
      - createdAt
      - updatedAt
      - userIndex
      - email
      - teams
      - activeTeamId
      - hasGithub
      - hasBitbucket
      additionalProperties: false
    '401':
      type: object
      properties:
        message:
          type: string
        code:
          type: string
      required:
      - message
      - code
    nanoid:
      type: string
      minLength: 5
    team-ref:
      type: object
      properties:
        teamUid:
          type: string
        teamName:
          $ref: '#/components/schemas/team-name'
        teamImageUri:
          $ref: '#/components/schemas/team-image'
      required:
      - teamUid
      - teamName
      additionalProperties: false
    '404':
      type: object
      properties:
        message:
          type: string
        code:
          type: string
      required:
      - message
      - code
    '403':
      type: object
      properties:
        message:
          type: string
        code:
          type: string
      required:
      - message
      - code
    team-name:
      type: string
    identity-provider-record:
      type: object
      properties:
        uid:
          $ref: '#/components/schemas/nanoid'
        createdAt:
          default: unixTimestamp()
          $ref: '#/components/schemas/timestamp'
        updatedAt:
          default: unixTimestamp()
          $ref: '#/components/schemas/timestamp'
        name:
          type: string
        provider:
          type: string
          enum:
          - local
          - google
          - okta
          - auth0
          - azure
          - one-login
          - ping-identity
        createUsers:
          default: false
          type: boolean
        signRequests:
          default: false
          type: boolean
        ssoUrl:
          default: ''
          description: This URL is used by Scalar to initiate a SAML login.
          type: string
        issuer:
          default: ''
          description: This is the URI that identifies your SAML identity provider. Any assertions must use a matching <saml:Issuer> attribute.
          type: string
        x509Cert:
          default: ''
          description: The authentication certificate issued by your identity provider
          type: string
        consumerOnly:
          type: boolean
      required:
      - uid
      - createdAt
      - updatedAt
      - name
      - provider
      - createUsers
      - signRequests
      - ssoUrl
      - issuer
      - x509Cert
      - consumerOnly
      additionalProperties: false
    '400':
      type: object
      properties:
        message:
          type: string
        code:
          type: string
      required:
      - message
      - code
    '422':
      type: object
      properties:
        message:
          type: string
        code:
          type: string
      required:
      - message
      - code
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
