openapi: 3.2.0
info:
  title: Scalar Workspace API
  contact:
    name: Marc from Scalar
    url: https://scalar.com
    email: support@scalar.com
  version: '1.0'
  description: 'Operations tagged workspace across 2 of this provider''s published API definitions: scalar-core.json, scalar-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.scalar.com/core
security:
- BearerAuth: []
tags:
- name: Workspace
paths:
  /workspaces/{namespace}:
    post:
      tags:
      - Workspace
      description: Creates a new workspace
      operationId: postworkspacesNamespace
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workspace'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400'
        '401':
          description: No auth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/403'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/404'
        '422':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422'
        '500':
          description: Uncaught error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/500'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  default: []
                title:
                  default: ''
                  type: string
                  maxLength: 100
                description:
                  default: ''
                  type: string
                isPrivate:
                  default: false
                  type: boolean
                slug:
                  default: randomManagedDocSlug()
                  $ref: '#/components/schemas/slug'
                version:
                  $ref: '#/components/schemas/version'
                loginPortal:
                  $ref: '#/components/schemas/slug'
                workspaceJson:
                  type: string
                accessGroups:
                  type: array
                  items:
                    $ref: '#/components/schemas/slug'
              additionalProperties: false
        required: true
      parameters:
      - schema:
          $ref: '#/components/schemas/namespace'
        in: path
        name: namespace
        required: true
      summary: Postworkspaces namespace
      x-summary-source: derived
  /workspaces/{namespace}/{slug}:
    patch:
      tags:
      - Workspace
      description: Update team workspace metadata
      operationId: patchworkspacesNamespaceSlug
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workspace'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400'
        '401':
          description: No auth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/403'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/404'
        '422':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422'
        '500':
          description: Uncaught error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/500'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                version:
                  $ref: '#/components/schemas/version'
                namespace:
                  $ref: '#/components/schemas/namespace'
                isPrivate:
                  type: boolean
                tags:
                  type: array
                  items:
                    type: string
                slug:
                  $ref: '#/components/schemas/slug'
                loginPortal:
                  $ref: '#/components/schemas/slug'
                accessGroups:
                  type: array
                  items:
                    $ref: '#/components/schemas/slug'
              additionalProperties: false
        required: true
      parameters:
      - schema:
          $ref: '#/components/schemas/namespace'
        in: path
        name: namespace
        required: true
      - schema:
          default: randomManagedDocSlug()
          $ref: '#/components/schemas/slug'
        in: path
        name: slug
        required: true
      summary: Patchworkspaces namespace slug
      x-summary-source: derived
    delete:
      tags:
      - Workspace
      description: Delete a team workspace
      operationId: deleteworkspacesNamespaceSlug
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: 'null'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400'
        '401':
          description: No auth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/403'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/404'
        '422':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422'
        '500':
          description: Uncaught error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/500'
      parameters:
      - schema:
          $ref: '#/components/schemas/namespace'
        in: path
        name: namespace
        required: true
      - schema:
          default: randomManagedDocSlug()
          $ref: '#/components/schemas/slug'
        in: path
        name: slug
        required: true
      summary: Deleteworkspaces namespace slug
      x-summary-source: derived
  /workspaces/{namespace}/{slug}/version:
    post:
      tags:
      - Workspace
      description: Create or update a workspace JSON version
      operationId: postworkspacesNamespaceSlugVersion
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workspace-version'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400'
        '401':
          description: No auth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/403'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/404'
        '422':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422'
        '500':
          description: Uncaught error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/500'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  $ref: '#/components/schemas/version'
                workspaceJson:
                  type: string
                isCurrent:
                  default: true
                  type: boolean
              required:
              - version
              - workspaceJson
              - isCurrent
              additionalProperties: false
        required: true
      parameters:
      - schema:
          $ref: '#/components/schemas/namespace'
        in: path
        name: namespace
        required: true
      - schema:
          default: randomManagedDocSlug()
          $ref: '#/components/schemas/slug'
        in: path
        name: slug
        required: true
      summary: Postworkspaces namespace slug version
      x-summary-source: derived
  /workspaces/{namespace}/{slug}/access/{group}:
    post:
      tags:
      - Workspace
      description: Adds an access group to a workspace
      operationId: postworkspacesNamespaceSlugAccessGroup
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: 'null'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400'
        '401':
          description: No auth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/403'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/404'
        '422':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422'
        '500':
          description: Uncaught error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/500'
      parameters:
      - schema:
          $ref: '#/components/schemas/namespace'
        in: path
        name: namespace
        required: true
      - schema:
          default: randomManagedDocSlug()
          $ref: '#/components/schemas/slug'
        in: path
        name: slug
        required: true
      - schema:
          $ref: '#/components/schemas/slug'
        in: path
        name: group
        required: true
      summary: Postworkspaces namespace slug access group
      x-summary-source: derived
    delete:
      tags:
      - Workspace
      description: Removes an access group from a workspace
      operationId: deleteworkspacesNamespaceSlugAccessGroup
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: 'null'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400'
        '401':
          description: No auth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/403'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/404'
        '422':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422'
        '500':
          description: Uncaught error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/500'
      parameters:
      - schema:
          $ref: '#/components/schemas/namespace'
        in: path
        name: namespace
        required: true
      - schema:
          default: randomManagedDocSlug()
          $ref: '#/components/schemas/slug'
        in: path
        name: slug
        required: true
      - schema:
          $ref: '#/components/schemas/slug'
        in: path
        name: group
        required: true
      summary: Deleteworkspaces namespace slug access group
      x-summary-source: derived
  /workspaces/{namespace}/{slug}/available:
    get:
      tags:
      - Workspace
      description: Check availability for workspace namespace and slug
      operationId: getworkspacesNamespaceSlugAvailable
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
                required:
                - available
                additionalProperties: false
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400'
        '401':
          description: No auth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/403'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/404'
        '422':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422'
        '500':
          description: Uncaught error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/500'
      parameters:
      - schema:
          $ref: '#/components/schemas/namespace'
        in: path
        name: namespace
        required: true
      - schema:
          default: randomManagedDocSlug()
          $ref: '#/components/schemas/slug'
        in: path
        name: slug
        required: true
      summary: Getworkspaces namespace slug available
      x-summary-source: derived
  /workspaces/{namespace}/{slug}/version/{version}:
    delete:
      tags:
      - Workspace
      description: Delete a team workspace version
      operationId: deleteworkspacesNamespaceSlugVersionVersion
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: 'null'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400'
        '401':
          description: No auth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/403'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/404'
        '422':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422'
        '500':
          description: Uncaught error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/500'
      parameters:
      - schema:
          $ref: '#/components/schemas/namespace'
        in: path
        name: namespace
        required: true
      - schema:
          default: randomManagedDocSlug()
          $ref: '#/components/schemas/slug'
        in: path
        name: slug
        required: true
      - schema:
          $ref: '#/components/schemas/version'
        in: path
        name: version
        required: true
      summary: Deleteworkspaces namespace slug version version
      x-summary-source: derived
components:
  schemas:
    nanoid:
      type: string
      minLength: 5
    namespace:
      type: string
      minLength: 3
      maxLength: 50
      pattern: ^[a-zA-Z0-9-_]+$
    timestamp:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    '404':
      type: object
      properties:
        message:
          type: string
        code:
          type: string
      required:
      - message
      - code
    slug:
      type: string
      minLength: 3
      maxLength: 60
      pattern: ^[a-z](?:[a-z0-9-]*[a-z0-9])?$
    '403':
      type: object
      properties:
        message:
          type: string
        code:
          type: string
      required:
      - message
      - code
    version:
      type: string
      minLength: 1
    '422':
      type: object
      properties:
        message:
          type: string
        code:
          type: string
      required:
      - message
      - code
    '401':
      type: object
      properties:
        message:
          type: string
        code:
          type: string
      required:
      - message
      - code
    workspace:
      type: object
      properties:
        uid:
          $ref: '#/components/schemas/nanoid'
        createdAt:
          default: unixTimestamp()
          $ref: '#/components/schemas/timestamp'
        updatedAt:
          default: unixTimestamp()
          $ref: '#/components/schemas/timestamp'
        namespace:
          $ref: '#/components/schemas/namespace'
        title:
          default: ''
          type: string
          maxLength: 100
        slug:
          default: randomManagedDocSlug()
          $ref: '#/components/schemas/slug'
        description:
          default: ''
          type: string
        isPrivate:
          default: false
          type: boolean
        tags:
          default: []
        accessGroups:
          default: []
        loginPortalUid:
          type: string
        verifiedContent:
          type: boolean
        version:
          $ref: '#/components/schemas/version'
        versions:
          type: array
          items:
            $ref: '#/components/schemas/workspace-version'
      required:
      - uid
      - createdAt
      - updatedAt
      - namespace
      - title
      - slug
      - description
      - isPrivate
      - tags
      - accessGroups
      - version
      - versions
      additionalProperties: false
    '400':
      type: object
      properties:
        message:
          type: string
        code:
          type: string
      required:
      - message
      - code
    '500':
      type: object
      properties:
        message:
          type: string
        code:
          type: string
      required:
      - message
      - code
    registry-meta:
      type: object
      properties:
        namespace:
          type: string
        slug:
          type: string
      required:
      - namespace
      - slug
      additionalProperties: false
    workspace-version:
      type: object
      properties:
        version:
          $ref: '#/components/schemas/version'
        managedDocs:
          type: array
          items:
            $ref: '#/components/schemas/registry-meta'
        createdAt:
          default: unixTimestamp()
          $ref: '#/components/schemas/timestamp'
        updatedAt:
          default: unixTimestamp()
          $ref: '#/components/schemas/timestamp'
      required:
      - version
      - managedDocs
      - createdAt
      - updatedAt
      additionalProperties: false
    doc-source:
      oneOf:
      - type: object
        properties:
          type:
            type: string
            const: platform
        required:
        - type
        additionalProperties: false
      - type: object
        properties:
          type:
            type: string
            const: git
          repositoryUid:
            $ref: '#/components/schemas/nanoid_2'
          path:
            type: string
            minLength: 1
          branch:
            default: null
            anyOf:
            - type: string
            - type: 'null'
          publishOnPush:
            default: true
            type: boolean
          publishOnMerge:
            default: false
            type: boolean
          currentPublishedSha:
            default: null
            anyOf:
            - type: string
            - type: 'null'
          lastPublishedAt:
            default: null
            anyOf:
            - $ref: '#/components/schemas/timestamp_2'
            - type: 'null'
        required:
        - type
        - repositoryUid
        - path
        - branch
        - publishOnPush
        - publishOnMerge
        - currentPublishedSha
        - lastPublishedAt
        additionalProperties: false
      - type: object
        properties:
          type:
            type: string
            const: url
          url:
            type: string
            format: uri
          linkedBy:
            type: string
          etag:
            default: null
            anyOf:
            - type: string
            - type: 'null'
          lastFetchedAt:
            default: null
            anyOf:
            - $ref: '#/components/schemas/timestamp_2'
            - type: 'null'
        required:
        - type
        - url
        - linkedBy
        - etag
        - lastFetchedAt
        additionalProperties: false
    nanoid_2:
      type: string
      minLength: 5
      examples:
      - UakgbKJ5m9gl0JDMbcJqL
    namespace_2:
      type: string
      minLength: 2
      maxLength: 50
      pattern: ^[a-zA-Z0-9-_]+$
      examples:
      - acme
    timestamp_2:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      examples:
      - 1735689600
    registry-git-binding:
      type: object
      properties:
        forgejo:
          type: object
          properties:
            owner:
              type: string
            repo:
              type: string
            branch:
              default: main
              type: string
          required:
          - owner
          - repo
          - branch
          additionalProperties: false
        publishOnPush:
          default: true
          type: boolean
        publishOnMerge:
          default: false
          type: boolean
        trackedBranch:
          default: main
          type: string
        webhookId:
          default: null
          anyOf:
          - type: number
          - type: 'null'
        external:
          default: null
          anyOf:
          - $ref: '#/components/schemas/registry-git-external'
          - type: 'null'
        currentPublishedSha:
          default: null
          anyOf:
          - type: string
          - type: 'null'
        lastPublishedAt:
          default: null
          anyOf:
          - $ref: '#/components/schemas/timestamp_2'
          - type: 'null'
      required:
      - forgejo
      - publishOnPush
      - publishOnMerge
      - trackedBranch
      - webhookId
      - external
      - currentPublishedSha
      - lastPublishedAt
      additionalProperties: false
    slug_2:
      type: string
      minLength: 1
      maxLength: 60
      pattern: ^[a-z](?:[a-z0-9-]*[a-z0-9])?$
      examples:
      - acme-api
    '403_2':
      type: object
      properties:
        message:
          type: string
        code:
          type: string
      required:
      - message
      - code
      examples:
      - message: You do not have permission to access this resource.
        code: forbidden
    '404_2':
      type: object
      properties:
        message:
          type: string
        code:
          type: string
      required:
      - message
      - code
      examples:
      - message: Resource not found.
        code: not-found
    version_2:
      type: string
      minLength: 1
      examples:
      - 1.2.0
    '422_2':
      type: object
      properties:
        message:
          type: string
        code:
          type: string
      required:
      - message
      - code
      examples:
      - message: The request body contains invalid values.
        code: invalid-payload
    '401_2':
      type: object
      properties:
        message:
          type: string
        code:
          type: string
      required:
      - message
      - code
      examples:
      - message: Invalid authentication token.
        code: unauthorized
    workspace_2:
      type: object
      properties:
        uid:
          $ref: '#/components/schemas/nanoid_2'
        createdAt:
          $ref: '#/components/schemas/timestamp_2'
        updatedAt:
          $ref: '#/components/schemas/timestamp_2'
        namespace:
          $ref: '#/components/schemas/namespace_2'
        title:
          default: ''
          examples:
          - Acme API
          type: string
          maxLength: 100
        slug:
          $ref: '#/components/schemas/slug_2'
        description:
          default: ''
          examples:
          - API for managing Acme products and orders.
          type: string
        isPrivate:
          default: false
          examples:
          - false
          type: boolean
        pinned:
          default: false
          type: boolean
        tags:
          default: []
          examples:
          - - products
            - orders
        accessGroups:
          default: []
          examples:
          - - UakgbKJ5m9gl0JDMbcJqL
        loginPortalUid:
          examples:
          - LakgbKJ5m9gl0JDMbcJqL
          type: string
        verifiedContent:
          type: boolean
        source:
          default:
            type: platform
          $ref: '#/components/schemas/doc-source'
        git:
          anyOf:
          - $ref: '#/components/schemas/registry-git-binding'
          - type: 'null'
        version:
          $ref: '#/components/schemas/version_2'
        versions:
          type: array
          items:
            $ref: '#/components/schemas/workspace-version'
      required:
      - uid
      - createdAt
      - updatedAt
      - namespace
      - title
      - slug
      - description
      - isPrivate
      - pinned
      - tags
      - accessGroups
      - source
      - version
      - versions
      additionalProperties: false
    '400_2':
      type: object
      properties:
        message:
          type: string
        code:
          type: string
      required:
      - message
      - code
      examples:
      - message: Invalid request parameters.
        code: bad-request
    '500_2':
      type: object
      properties:
        message:
          type: string
        code:
          type: string
      required:
      - message
      - code
      examples:
      - message: An unexpected error occurred.
        code: unknown
    registry-git-external:
      oneOf:
      - type: object
        properties:
          provider:
            type: string
            const: github
          linkedBy:
            type: string
          installationId:
            type: integer
            minimum: -9007199254740991
            maximum: 9007199254740991
          id:
            type: integer
            minimum: -9007199254740991
            maximum: 9007199254740991
          name:
            type: string
            minLength: 2
          branch:
            default: main
            type: string
          path:
            default: ''
            type: string
          webhookId:
