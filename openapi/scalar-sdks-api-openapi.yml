      tags:
      - SDKs
      description: List the team SDKs
      operationId: getV1Sdks
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/sdk'
                  hasMore:
                    type: boolean
                required:
                - data
                - hasMore
                additionalProperties: false
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400_2'
        '401':
          description: No auth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401_2'
        '403':
          description: Forbidden
          content:
            application/json:
