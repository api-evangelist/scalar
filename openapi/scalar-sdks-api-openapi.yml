        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                apiUid:
                  $ref: '#/components/schemas/nanoid'
                language:
                  type: string
                  enum:
                  - typescript
                  - python
                  - csharp
                  - java
                  - ruby
                  - php
                  - go
              required:
              - apiUid
              - language
              additionalProperties: false
        required: true
  /v1/sdks/version:
