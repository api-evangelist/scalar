          content:
            application/json:
              schema:
                $ref: '#/components/schemas/500'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                apiUid:
                  $ref: '#/components/schemas/nanoid'
                language:
                  type: string
                  enum:
                  - typescript
                  - python
                  - csharp
                  - java
                  - ruby
                  - php
                  - go
              required:
              - apiUid
              - language
              additionalProperties: false
        required: true
      summary: Postv1 sdks
      x-summary-source: derived
