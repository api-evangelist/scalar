                $ref: '#/components/schemas/403_2'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/404_2'
        '422':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422_2'
        '500':
          description: Uncaught error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/500_2'
      parameters:
      - schema:
          default: 50
          type: integer
          minimum: 1
          maximum: 200
        in: query
        name: limit
        required: true
      summary: Get V1Sdks
      x-summary-source: derived
