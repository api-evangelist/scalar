openapi: 3.1.1
info:
  title: Core access-groups sdks API
  description: Core services for Scalar
  version: 1.0.1
  contact:
    name: Marc from Scalar
    url: https://scalar.com
    email: support@scalar.com
security:
- BearerAuth: []
tags:
- name: sdks
paths:
  /v1/sdks/sync:
    post:
      tags:
      - sdks
      description: Manually trigger git sync for SDK build
      operationId: postv1SdksSync
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: 'null'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400'
        '401':
          description: No auth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/403'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/404'
        '422':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422'
        '500':
          description: Uncaught error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/500'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                buildUid:
                  $ref: '#/components/schemas/nanoid'
              required:
              - buildUid
              additionalProperties: false
        required: true
  /v1/sdks:
    post:
      tags:
      - sdks
      description: Creates a new sdk from a registry API
      operationId: postv1Sdks
