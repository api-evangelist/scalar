  /docs-projects/{projectUid}/switch-repository:
    post:
      description: 'Point an already-connected DocsProject at a different repository, across providers if needed. Moves no files: the target must already hold the docs, and the project is re-pointed at the Scalar config found there. The previous repository is left exactly as it is.'
