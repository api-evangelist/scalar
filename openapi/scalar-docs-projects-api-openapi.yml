              schema:
                $ref: '#/components/schemas/500'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                installationId:
                  type: integer
                  minimum: -9007199254740991
                  maximum: 9007199254740991
                repoId:
                  type: integer
                  minimum: -9007199254740991
                  maximum: 9007199254740991
              required:
              - installationId
              - repoId
              additionalProperties: false
        required: true
      parameters:
      - schema:
          $ref: '#/components/schemas/nanoid'
        in: path
        name: projectUid
        required: true
      tags:
      - Docs Projects
      summary: Postdocs projects project uid link github
      x-summary-source: derived
  /docs-projects/{projectUid}/unlink-github:
    post:
      description: Convert a GitHub-backed DocsProject back to a Forgejo-backed one. Migrates the GitHub repository contents into a fresh Forgejo repo and flips the project provider.
      operationId: postdocsProjectsProjectUidUnlinkGithub
