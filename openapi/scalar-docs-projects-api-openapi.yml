openapi: 3.2.0
info:
  title: Scalar Docs Projects API
  contact:
    name: Marc from Scalar
    url: https://scalar.com
    email: support@scalar.com
  version: '1.0'
  description: 'Operations tagged Docs Projects across 3 of this provider''s published API definitions: scalar-core.json, scalar-openapi.json, scalar-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.scalar.com/core
security:
- BearerAuth: []
tags:
- name: Docs Projects
paths:
  /docs-projects/create:
    post:
      description: Create a unified DocsProject backed by the chosen VCS provider (forgejo, github, or bitbucket)
      operationId: postdocsProjectsCreate
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs-project'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400'
        '401':
          description: No auth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/403'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/404'
        '422':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422'
        '500':
          description: Uncaught error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/500'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                slug:
                  $ref: '#/components/schemas/slug'
                isPrivate:
                  default: false
                  type: boolean
                provider:
                  type: string
                  enum:
                  - forgejo
                  - github
                  - bitbucket
                githubRepository:
                  type: object
                  properties:
                    installationId:
                      type: integer
                      minimum: -9007199254740991
                      maximum: 9007199254740991
                    repoId:
                      type: integer
                      minimum: -9007199254740991
                      maximum: 9007199254740991
                  required:
                  - installationId
                  - repoId
                  additionalProperties: false
                bitbucketRepository:
                  type: object
                  properties:
                    workspaceUuid:
                      type: string
                    repoUuid:
                      type: string
                  required:
                  - workspaceUuid
                  - repoUuid
                  additionalProperties: false
              required:
              - name
              - isPrivate
              - provider
              additionalProperties: false
        required: true
      tags:
      - Docs Projects
      summary: Postdocs projects create
      x-summary-source: derived
  /docs-projects/delete:
    delete:
      description: Delete a unified DocsProject. Tears down deploys + publish records + cached builds, repoints user activeProjectUid, deletes the Forgejo repo (if any), and notifies subscribers. User-owned GitHub repos are left untouched.
      operationId: deletedocsProjectsDelete
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: 'null'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400'
        '401':
          description: No auth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/403'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/404'
        '422':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422'
        '500':
          description: Uncaught error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/500'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                projectUid:
                  $ref: '#/components/schemas/nanoid'
              required:
              - projectUid
              additionalProperties: false
        required: true
      tags:
      - Docs Projects
      summary: Deletedocs projects delete
      x-summary-source: derived
  /docs-projects/{slug}:
