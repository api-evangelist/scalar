      parameters:
      - schema:
          $ref: '#/components/schemas/slug'
        in: path
        name: slug
        required: true
      tags:
      - Docs Projects
      summary: Getdocs projects slug
      x-summary-source: derived
  /docs-projects/update-repo-settings:
    post:
      description: Update editable repository settings (tracked branch, config path) on a unified DocsProject. Publish flags live in scalar.config.json.
      operationId: postdocsProjectsUpdateRepoSettings
      responses:
        '200':
          description: Default Response
          content:
