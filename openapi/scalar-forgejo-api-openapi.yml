          content:
            application/json:
              schema:
                type: object
                properties:
                  forgejoBaseUrl:
                    type: string
                  forgejoToken:
                    type: string
                  forgejoUsername:
                    type: string
                required:
                - forgejoBaseUrl
                - forgejoToken
                - forgejoUsername
                additionalProperties: false
        '400':
