components:
  schemas:
    namespace:
      type: string
      minLength: 3
      maxLength: 50
      pattern: ^[a-zA-Z0-9-_]+$
    managed-doc-version:
      type: object
      properties:
        uid:
          $ref: '#/components/schemas/nanoid'
        createdAt:
          type: number
        version:
          $ref: '#/components/schemas/version'
        upgraded:
          default: false
          type: boolean
        embedStatus:
          default: null
          anyOf:
          - type: string
            enum:
            - complete
            - failed
          - type: 'null'
        tags:
          default: []
          type: array
          items:
            type: string
        tools:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              method:
                $ref: '#/components/schemas/method'
              enabledTools:
                type: array
                items:
                  type: string
                  enum:
                  - execute-request
                  - get-mini-openapi-spec
            required:
            - path
            - method
            - enabledTools
            additionalProperties: false
        yamlSha:
          type: string
        jsonSha:
          type: string
        versionSha:
          type: string
      required:
      - uid
      - createdAt
      - version
      - upgraded
      - embedStatus
      - tags
      additionalProperties: false
    method:
      type: string
      enum:
      - delete
      - get
      - head
      - options
      - patch
      - post
      - put
      - trace
    nanoid:
      type: string
      minLength: 5
    '404':
      type: object
      properties:
        message:
          type: string
        code:
          type: string
      required:
      - message
      - code
    '401':
      type: object
      properties:
        message:
          type: string
        code:
          type: string
      required:
      - message
      - code
    version:
      type: string
      minLength: 1
    slug:
      type: string
      minLength: 3
      maxLength: 60
      pattern: ^[a-z](?:[a-z0-9-]*[a-z0-9])?$
    '500':
      type: object
      properties:
        message:
          type: string
        code:
          type: string
      required:
      - message
      - code
    managed-doc:
      type: object
      properties:
        uid:
          default: nanoid()
          $ref: '#/components/schemas/nanoid'
        createdAt:
          default: unixTimestamp()
          $ref: '#/components/schemas/timestamp'
        updatedAt:
          default: unixTimestamp()
          $ref: '#/components/schemas/timestamp'
        namespace:
          $ref: '#/components/schemas/namespace'
        title:
          default: ''
          type: string
          maxLength: 100
        slug:
          default: randomManagedDocSlug()
          $ref: '#/components/schemas/slug'
        description:
          default: ''
          type: string
        isPrivate:
          default: false
          type: boolean
        tags:
          default: []
        accessGroups:
          default: []
        loginPortalUid:
          type: string
        verifiedContent:
          type: boolean
        version:
          $ref: '#/components/schemas/version'
        isExternal:
          default: true
          type: boolean
        repository:
          type: object
          properties:
            linkedBy:
              type: string
            id:
              type: number
            name:
              type: string
              minLength: 2
            path:
              default: ''
              type: string
            branch:
              default: ''
              type: string
          required:
          - linkedBy
          - id
          - name
          - path
          - branch
          additionalProperties: false
        sourceUrl:
          type: string
          format: uri
        theme:
          default: ''
          type: string
        editableUid:
          type: string
        ruleset:
          default: 'extends: spectral:oas

            rules: {}'
          type: string
        versions:
          type: array
          items:
            $ref: '#/components/schemas/managed-doc-version'
        agentEnabled:
          default: true
          type: boolean
        verified:
          default: false
          type: boolean
      required:
      - uid
      - createdAt
      - updatedAt
      - namespace
      - title
      - slug
      - description
      - isPrivate
      - tags
      - accessGroups
      - version
      - isExternal
      - theme
      - editableUid
      - ruleset
      - versions
      - agentEnabled
      - verified
      additionalProperties: false
    '400':
      type: object
      properties:
        message:
          type: string
        code:
          type: string
      required:
      - message
      - code
    '403':
      type: object
      properties:
        message:
          type: string
        code:
          type: string
      required:
      - message
      - code
    timestamp:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    '422':
      type: object
      properties:
        message:
          type: string
        code:
          type: string
      required:
      - message
      - code
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
