openapi: 3.2.0
info:
  title: Scalar Access Groups API
  contact:
    name: Marc from Scalar
    url: https://scalar.com
    email: support@scalar.com
  version: '1.0'
  description: 'Operations tagged access-groups across 2 of this provider''s published API definitions: scalar-core.json, scalar-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.scalar.com/core
security:
- BearerAuth: []
tags:
- name: Access Groups
paths:
  /v1/access-groups/{slug}:
    get:
      tags:
      - Access Groups
      description: Get an access group by slug
      operationId: getv1AccessGroupsSlug
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid:
                    default: nanoid()
                    $ref: '#/components/schemas/nanoid'
                  name:
                    default: ''
                    $ref: '#/components/schemas/access-group-name'
                  slug:
                    default: randomAccessGroupSlug()
                    $ref: '#/components/schemas/slug'
                  allowedDomains:
                    default: []
                  allowedEmails:
                    default: []
                required:
                - uid
                - name
                - slug
                - allowedDomains
                - allowedEmails
                additionalProperties: false
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400'
        '401':
          description: No auth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/403'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/404'
        '422':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422'
        '500':
          description: Uncaught error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/500'
      parameters:
      - schema:
          type: string
        in: path
        name: slug
        required: true
      summary: Getv1 access groups slug
      x-summary-source: derived
  /v1/access-groups:
    post:
      tags:
      - Access Groups
      description: Creates an access group
      operationId: postv1AccessGroups
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access-group'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400'
        '401':
          description: No auth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/403'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/404'
        '422':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422'
        '500':
          description: Uncaught error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/500'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: '#/components/schemas/access-group-name'
                slug:
                  $ref: '#/components/schemas/slug'
                allowedDomains: {}
                allowedEmails: {}
              additionalProperties: false
        required: true
      summary: Postv1 access groups
      x-summary-source: derived
    get:
      tags:
      - Access Groups
      description: List access groups for the current team
      operationId: getV1AccessGroups
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    uid:
                      $ref: '#/components/schemas/nanoid_2'
                    name:
                      default: ''
                      $ref: '#/components/schemas/access-group-name_2'
                    slug:
                      examples:
                      - engineering
                      $ref: '#/components/schemas/slug_2'
                    allowedDomains:
                      default: []
                      examples:
                      - - example.com
                    allowedEmails:
                      default: []
                      examples:
                      - - alex@example.com
                  required:
                  - uid
                  - name
                  - slug
                  - allowedDomains
                  - allowedEmails
                  additionalProperties: false
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400_2'
        '401':
          description: No auth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401_2'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/403_2'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/404_2'
        '422':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422_2'
        '500':
          description: Uncaught error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/500_2'
      summary: Get V1 access groups
      x-summary-source: derived
