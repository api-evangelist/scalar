- breaking: false
  highlights:
  - AsyncAPI operations, messages, and protocols now render inline
  - AsyncAPI operations and their messages (with payload and header schemas) now render nested inside each channel in both modern and classic
    layouts
  - Channel headers show which servers they are available on and their protocols, while message headers display every protocol they are carried
    over
  - New requestBuilt client plugin hook and onRequestBuilt callback expose the exact fetch Request sent over the wire, enabling request signing
    with accurate body hashes
  date: '2026-06-22'
