aid: scalar
name: Scalar
description: Scalar is an open-source API platform built around the OpenAPI standard. It provides API documentation
  (API References), an offline-first API client, a centralized API registry for managing OpenAPI documents, JSON
  schemas and Spectral rules, and automated SDK generation for TypeScript, Python, Go, PHP, Java, and Ruby. Used
  by teams at SmartBear, Microsoft ASP.NET, and 30+ framework ecosystems including Express, FastAPI, NestJS, and
  Spring Boot. The platform has 14.9k GitHub stars and is MIT licensed. Scalar is backed by a strong open-source
  community and positions itself as the modern, open alternative to Swagger UI and Postman.
