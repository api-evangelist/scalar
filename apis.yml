apis:
- aid: scalar:scalar-api-references
  name: Scalar API References
  description: >-
    Scalar API References renders modern, interactive API documentation from OpenAPI and Swagger specifications.
    Features include multiple themes, custom styling, dark mode, mobile responsiveness, built-in search,
    and an interactive request panel for testing APIs directly in the docs. Supports OpenAPI 3.0 and 3.1,
    $ref resolution, allOf/oneOf/anyOf, and authentication schemes. Framework integrations include React,
    Vue, FastAPI, ASP.NET Core, Spring Boot, NestJS, Express, and 30+ others.
  tags:
  - Documentation
  - Interactive
  - OpenAPI
  - References
  - Swagger
