- aid: scalar:scalar-sdks
  name: Scalar SDKs
  description: >-
    Scalar SDKs generates type-safe client libraries from OpenAPI specifications. Supported languages
    include TypeScript, Python, Golang, PHP, Java, and Ruby. Features include automated GitHub workflows,
    code samples, full OpenAPI auth support, file streaming, and webhook support. SDK generation is $100
    per month per language on paid plans.
  tags:
  - Code Generation
  - Go
  - Java
  - PHP
  - Python
  - Ruby
