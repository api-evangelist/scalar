    url: https://github.com/scalar/scalar
- aid: scalar:scalar-docs
  name: Scalar Docs
  description: >-
    Scalar Docs enables teams to create and publish developer documentation that stays in sync with their
    API and code. Supports writing with a WYSIWYG editor, pulling Markdown and MDX files from repositories,
    and generating API references from OpenAPI documents with Git Sync and CI/CD integration. Custom domains,
    team collaboration, and versioning are available on paid plans.
  tags:
  - Developer Portal
  - Documentation
  - Git Sync
  - Markdown
  - MDX
  humanURL: https://scalar.com/products/docs/getting-started
  properties:
  - type: GettingStarted
