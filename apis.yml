- aid: scalar:scalar-registry
  name: Scalar Registry
  description: >-
    Scalar Registry provides centralized management and versioning of OpenAPI Documents, JSON Schemas,
    and Spectral Rules with deep Git integration. Serves as the single source of truth for API definitions
    across teams. Supports both private and public registries with CI/CD workflows via CLI and GitHub
    Actions. Publish via the scalar CLI: `scalar registry publish`.
  tags:
