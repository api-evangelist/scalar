apis:
- aid: scalar:scalar-api-references
  name: Scalar API References
  description: >-
    Scalar API References renders modern, interactive API documentation from OpenAPI and Swagger specifications.
    Features include multiple themes, custom styling, dark mode, mobile responsiveness, built-in search,
    and an interactive request panel for testing APIs directly in the docs. Supports OpenAPI 3.0 and 3.1,
    $ref resolution, allOf/oneOf/anyOf, and authentication schemes. Framework integrations include React,
    Vue, FastAPI, ASP.NET Core, Spring Boot, NestJS, Express, and 30+ others.
  tags:
  - Documentation
  - Interactive
  - OpenAPI
  - References
  - Swagger
  humanURL: https://scalar.com/products/api-references/getting-started
  properties:
  - type: GettingStarted
    url: https://scalar.com/products/api-references/getting-started
  - type: Documentation
    url: https://guides.scalar.com/scalar/scalar-api-references/getting-started
  - type: GitHub
    url: https://github.com/scalar/scalar
  - type: NPM
    url: https://www.npmjs.com/package/@scalar/api-reference
- aid: scalar:scalar-api-client
  name: Scalar API Client
  description: >-
    Scalar API Client is a fully open-source, offline-first REST API client built on the OpenAPI standard.
    Supports collections, environments, pre/post-response scripting, test results, and collection runners.
    Available for Windows, macOS, and Linux as a desktop application and as a browser-based version at
    client.scalar.com. Imports OpenAPI files to auto-generate request collections with authentication
    pre-configured.
  tags:
  - API Client
  - Collection
  - OpenAPI
  - REST
  - Testing
  tags_raw:
  - API Client
  - Collections
  - OpenAPI
  - REST
  - Testing
