- aid: scalar:scalar-api-client
  name: Scalar API Client
  description: >-
    Scalar API Client is a fully open-source, offline-first REST API client built on the OpenAPI standard.
    Supports collections, environments, pre/post-response scripting, test results, and collection runners.
    Available for Windows, macOS, and Linux as a desktop application and as a browser-based version at
    client.scalar.com. Imports OpenAPI files to auto-generate request collections with authentication
    pre-configured.
  tags:
  - API Client
  - Collection
  - OpenAPI
  - REST
  - Testing
