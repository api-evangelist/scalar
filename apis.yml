  description: >-
    Open-source (MIT) renderer that turns an OpenAPI/Swagger or AsyncAPI document into an interactive
    API reference with a built-in request-testing panel and multi-language code samples. Embeds from a
    single HTML file or as the @scalar/api-reference npm package, and ships as the default docs UI in
    dozens of frameworks. This is a self-hosted component library, not a hosted REST API - surface documented
    as a capability area (endpointsModeled).
